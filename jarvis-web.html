<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#060A0F;
    --panel:#0C141C;
    --panel-border:rgba(93,224,230,0.14);
    --accent:#5DE0E6;
    --accent-dim:rgba(93,224,230,0.35);
    --accent-glow:rgba(93,224,230,0.55);
    --text:#DCEEF0;
    --text-muted:#5E747A;
    --warn:#E6A85D;
    --danger:#E07A6B;
    --mono:'JetBrains Mono', monospace;
    --display:'Space Grotesk', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(93,224,230,0.07), transparent 55%),
      repeating-linear-gradient(0deg, rgba(93,224,230,0.025) 0px, rgba(93,224,230,0.025) 1px, transparent 1px, transparent 32px),
      repeating-linear-gradient(90deg, rgba(93,224,230,0.025) 0px, rgba(93,224,230,0.025) 1px, transparent 1px, transparent 32px),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    display:flex;
    justify-content:center;
    padding:48px 20px 64px;
  }
  .app{width:100%; max-width:460px;}

  header{text-align:center; margin-bottom:32px;}
  .eyebrow{font-size:11px; letter-spacing:0.18em; color:var(--text-muted); text-transform:uppercase;}
  h1{
    font-family:var(--display); font-weight:700; font-size:34px; letter-spacing:0.04em;
    margin:6px 0 0; color:var(--text);
    text-shadow:0 0 18px var(--accent-dim);
  }

  .connect{
    display:flex; gap:8px; margin-bottom:36px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:10px;
    padding:10px;
  }
  .connect input{
    flex:1; min-width:0; background:transparent; border:none; outline:none;
    color:var(--text); font-family:var(--mono); font-size:12px; padding:4px 6px;
  }
  .connect input::placeholder{color:var(--text-muted);}
  .connect button{
    background:transparent; border:1px solid var(--accent-dim); color:var(--accent);
    font-family:var(--mono); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;
    border-radius:7px; padding:7px 12px; cursor:pointer; white-space:nowrap;
    transition:background 0.15s;
  }
  .connect button:hover{background:rgba(93,224,230,0.08);}
  .status-dot{
    width:7px; height:7px; border-radius:50%; align-self:center; margin-right:2px;
    background:var(--text-muted); flex-shrink:0; transition:background 0.2s, box-shadow 0.2s;
  }
  .status-dot.connected{background:var(--accent); box-shadow:0 0 8px var(--accent-glow);}

  .mic-area{display:flex; flex-direction:column; align-items:center; margin-bottom:28px;}
  .orb-wrap{position:relative; width:152px; height:152px; display:flex; align-items:center; justify-content:center;}
  .ring{
    position:absolute; inset:0; border-radius:50%; border:1px solid var(--accent-dim);
    opacity:0; pointer-events:none;
  }
  .orb.listening .ring{animation:pulse-ring 1.8s ease-out infinite;}
  .orb.listening .ring:nth-child(2){animation-delay:0.6s;}
  .orb.listening .ring:nth-child(3){animation-delay:1.2s;}
  @keyframes pulse-ring{
    0%{transform:scale(0.78); opacity:0.55;}
    100%{transform:scale(1.55); opacity:0;}
  }
  .orb{
    position:relative; width:104px; height:104px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(93,224,230,0.16), rgba(93,224,230,0.03));
    border:1px solid var(--accent-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--accent);
    transition:box-shadow 0.25s, border-color 0.25s;
    box-shadow:0 0 0 rgba(93,224,230,0);
  }
  .orb:hover{box-shadow:0 0 26px var(--accent-dim);}
  .orb.listening{border-color:var(--accent); box-shadow:0 0 30px var(--accent-glow);}
  .orb.thinking{border-color:var(--warn); color:var(--warn);}
  .orb.speaking{border-color:var(--accent); box-shadow:0 0 30px var(--accent-glow);}
  .orb:disabled, .orb.disabled{opacity:0.35; cursor:not-allowed;}

  .spinner{display:none; position:absolute; inset:-1px; border-radius:50%;
    border:2px solid transparent; border-top-color:var(--warn); border-right-color:var(--warn);}
  .orb.thinking .spinner{display:block; animation:spin 0.9s linear infinite;}
  .orb.thinking .mic-icon{opacity:0.25;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .bars{display:none; align-items:flex-end; gap:4px; height:34px;}
  .orb.speaking .bars{display:flex;}
  .orb.speaking .mic-icon{display:none;}
  .bars span{width:4px; background:var(--accent); border-radius:2px; height:8px;
    animation:bar-bounce 0.9s ease-in-out infinite;}
  .bars span:nth-child(1){animation-delay:0s;}
  .bars span:nth-child(2){animation-delay:0.15s;}
  .bars span:nth-child(3){animation-delay:0.3s;}
  .bars span:nth-child(4){animation-delay:0.45s;}
  .bars span:nth-child(5){animation-delay:0.6s;}
  @keyframes bar-bounce{0%,100%{transform:scaleY(0.3);}50%{transform:scaleY(1.9);}}

  .status-text{margin-top:18px; font-size:12px; letter-spacing:0.04em; color:var(--text-muted); text-align:center; min-height:16px;}
  .hint{font-size:11px; color:var(--text-muted); text-align:center; margin-top:6px; max-width:300px;}

  .textrow{display:flex; gap:8px; margin-bottom:24px;}
  .textrow input{
    flex:1; min-width:0; background:var(--panel); border:1px solid var(--panel-border);
    border-radius:9px; color:var(--text); font-family:var(--mono); font-size:13px; padding:11px 12px; outline:none;
  }
  .textrow input:focus{border-color:var(--accent-dim);}
  .textrow button{
    background:var(--accent); border:none; color:#04181A; border-radius:9px; width:42px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }

  .transcript{
    background:var(--panel); border:1px solid var(--panel-border); border-radius:12px;
    padding:14px 16px; height:260px; overflow-y:auto; font-size:12.5px; line-height:1.6;
  }
  .transcript::-webkit-scrollbar{width:6px;}
  .transcript::-webkit-scrollbar-thumb{background:var(--panel-border); border-radius:3px;}
  .msg{margin-bottom:14px;}
  .msg:last-child{margin-bottom:0;}
  .msg .meta{font-size:10px; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:3px;}
  .msg.user .meta{color:var(--text-muted);}
  .msg.jarvis .meta{color:var(--accent);}
  .msg.system .meta{color:var(--danger);}
  .msg .body{color:var(--text); white-space:pre-wrap; word-break:break-word;}
  .msg.system .body{color:var(--danger);}
  .empty-note{color:var(--text-muted); font-size:12px; text-align:center; padding-top:90px;}
  .code-block{
    background:#04090D; border:1px solid var(--panel-border); border-radius:8px;
    padding:10px 12px; margin:8px 0; overflow-x:auto;
  }
  .code-block code{font-size:11.5px; color:var(--accent); white-space:pre;}

  footer{text-align:center; margin-top:18px; font-size:10.5px; color:var(--text-muted);}
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">assistente pessoal · web</div>
    <h1>JARVIS</h1>
  </header>

  <div class="connect">
    <span class="status-dot" id="statusDot"></span>
    <input id="webhookInput" type="url" placeholder="URL do servidor (ex: http://localhost:3000/chat)">
    <button id="connectBtn">Conectar</button>
  </div>

  <div class="mic-area">
    <div class="orb-wrap">
      <div class="orb" id="orb">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span>
        <span class="spinner"></span>
        <svg class="mic-icon" viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
          <line x1="8" y1="22" x2="16" y2="22"></line>
        </svg>
        <div class="bars"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    </div>
    <div class="status-text" id="statusText">Toque para falar</div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="textrow">
    <input id="textInput" type="text" placeholder="...ou digite aqui">
    <button id="sendBtn" title="Enviar">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <div class="transcript" id="transcript">
    <div class="empty-note" id="emptyNote">a conversa aparece aqui</div>
  </div>

  <footer>reconhecimento de voz funciona melhor no Chrome ou Edge</footer>
</div>

<script>
  // O servidor Node.js (server.js) roda local por padrão nessa porta:
  const DEFAULT_WEBHOOK_URL = "http://localhost:3000/chat";

  const orb = document.getElementById('orb');
  const statusText = document.getElementById('statusText');
  const hint = document.getElementById('hint');
  const webhookInput = document.getElementById('webhookInput');
  const connectBtn = document.getElementById('connectBtn');
  const statusDot = document.getElementById('statusDot');
  const textInput = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const transcript = document.getElementById('transcript');
  const emptyNote = document.getElementById('emptyNote');

  let webhookUrl = '';
  let state = 'idle'; // idle | listening | thinking | speaking
  const sessionId = 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);

  function setState(s){
    state = s;
    orb.classList.remove('listening', 'thinking', 'speaking');
    if (s !== 'idle') orb.classList.add(s);
    const labels = {
      idle: 'Toque para falar',
      listening: 'Ouvindo…',
      thinking: 'Processando…',
      speaking: 'Respondendo…'
    };
    statusText.textContent = labels[s];
  }

  function renderMessageBody(container, text){
    const regex = /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;
    let lastIndex = 0, match;
    while ((match = regex.exec(text)) !== null) {
      if (match.index > lastIndex) {
        const span = document.createElement('span');
        span.textContent = text.slice(lastIndex, match.index);
        container.appendChild(span);
      }
      const pre = document.createElement('pre');
      pre.className = 'code-block';
      const code = document.createElement('code');
      code.textContent = match[2].replace(/\n$/, '');
      pre.appendChild(code);
      container.appendChild(pre);
      lastIndex = regex.lastIndex;
    }
    if (lastIndex < text.length) {
      const span = document.createElement('span');
      span.textContent = text.slice(lastIndex);
      container.appendChild(span);
    }
  }

  function addMessage(role, text){
    if (emptyNote) { emptyNote.remove(); }
    const row = document.createElement('div');
    row.className = 'msg ' + role;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (role === 'user' ? 'você' : role === 'jarvis' ? 'jarvis' : 'sistema') +
      ' · ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    const body = document.createElement('div');
    body.className = 'body';
    renderMessageBody(body, text);
    row.appendChild(meta);
    row.appendChild(body);
    transcript.appendChild(row);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function setConnected(url){
    webhookUrl = url;
    statusDot.classList.toggle('connected', !!url);
  }

  connectBtn.addEventListener('click', () => {
    const val = webhookInput.value.trim();
    if (!val) return;
    setConnected(val);
  });

  if (DEFAULT_WEBHOOK_URL) {
    webhookInput.value = DEFAULT_WEBHOOK_URL;
    setConnected(DEFAULT_WEBHOOK_URL);
  }

  async function sendMessage(text){
    if (!text || !text.trim()) { setState('idle'); return; }
    if (!webhookUrl) {
      addMessage('system', 'Configure a URL do servidor no campo acima antes de falar.');
      setState('idle');
      return;
    }
    addMessage('user', text);
    setState('thinking');
    try {
      const res = await fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, sessionId: sessionId })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      const reply = data.reply ?? data.output ?? data.text ?? JSON.stringify(data);
      addMessage('jarvis', reply);
      speak(toSpeech(reply));
    } catch (err) {
      addMessage('system', 'Erro: ' + err.message);
      setState('idle');
    }
  }

  function toSpeech(text){
    return text.replace(/```[\s\S]*?```/g, ' Veja o código na tela. ').replace(/\s+/g, ' ').trim();
  }

  function speak(text){
    if (!('speechSynthesis' in window)) { setState('idle'); return; }
    speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const ptVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('pt'));
    if (ptVoice) utter.voice = ptVoice;
    utter.lang = 'pt-BR';
    utter.onstart = () => setState('speaking');
    utter.onend = () => setState('idle');
    utter.onerror = () => setState('idle');
    speechSynthesis.speak(utter);
  }

  // --- Reconhecimento de voz ---
  const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let finalTranscript = '';

  if (SpeechRecognitionImpl) {
    recognition = new SpeechRecognitionImpl();
    recognition.lang = 'pt-BR';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          finalTranscript += event.results[i][0].transcript;
        }
      }
    };
    recognition.onend = () => {
      const text = finalTranscript.trim();
      finalTranscript = '';
      if (text) sendMessage(text); else setState('idle');
    };
    recognition.onerror = () => {
      finalTranscript = '';
      setState('idle');
    };
  } else {
    hint.textContent = 'Reconhecimento de voz indisponível neste navegador — use o campo de texto abaixo.';
  }

  orb.addEventListener('click', () => {
    if (state === 'speaking') {
      speechSynthesis.cancel();
      setState('idle');
      return;
    }
    if (state === 'thinking') return;
    if (!recognition) return;
    if (state === 'listening') {
      recognition.stop();
      return;
    }
    finalTranscript = '';
    try {
      recognition.start();
      setState('listening');
    } catch (e) {
      setState('idle');
    }
  });

  function sendFromTextInput(){
    const val = textInput.value;
    textInput.value = '';
    sendMessage(val);
  }
  sendBtn.addEventListener('click', sendFromTextInput);
  textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendFromTextInput(); });
</script>
</body>
</html>
